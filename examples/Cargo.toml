[package]
name = "examples"
publish = false
edition = "2021"
version = "0.0.0"

[[bin]]
name = "fake-crawler"
path = "src/fake_crawler/main.rs"

[dependencies]
async-trait = "0.1.82"
exn = "0.3.1"
tokio = { version = "1.43.1", features = ["rt-multi-thread", "macros"] }
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
webcrawler = { path = ".." }
